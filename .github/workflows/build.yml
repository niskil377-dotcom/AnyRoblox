# Builds the Windows release folder from source on every push and pull request,
# and on demand from the Actions tab (Run workflow). Works the same in forks.
# The result is attached to the run as the AnyRoblox-win-x64 artifact.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Download P3DDebin and HEMTT
        shell: powershell
        run: ./desktop/fetch-tools.ps1

      - name: Build
        shell: powershell
        run: ./desktop/build.ps1

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: AnyRoblox-win-x64
          path: dist/AnyRoblox/
          if-no-files-found: error
